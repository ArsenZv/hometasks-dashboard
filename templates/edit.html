{% extends "base.html" %}
{% block title %}Potato Bakery Inc. · Edit{% endblock %}
{% block content %}
<div class="page-head">
    <h2 class="page-title">Edit Tasks</h2>
    <p id="app-version">Version: {{ app_version }}</p>
</div>

<form id="add-form" class="panel add-item-container" autocomplete="off">
    <input type="text" id="new-item" placeholder="New task name" maxlength="80" aria-label="New task name">
    <input type="number" id="new-lifespan" placeholder="Every … days" step="0.5" min="0.5" aria-label="Frequency in days">
    <button type="submit" id="add-button" disabled>
        <img src="{{ url_for('static', filename='icons/plus.png') }}" alt="" class="btn-icon"> Add
    </button>
</form>

<div class="panel table-panel">
    <div class="task-table" role="table">
        <div class="task-row header" role="row">
            <span role="columnheader">Task</span>
            <span role="columnheader">Status</span>
            <span role="columnheader">Last done</span>
            <span role="columnheader">Frequency</span>
        </div>
        <div id="task-rows"></div>
    </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box panel">
        <div class="modal-head">
            <img id="modal-icon" class="modal-icon" alt="">
            <h2 id="modal-title">Edit task</h2>
            <button type="button" id="modal-close" class="icon-button" title="Close">
                <img src="{{ url_for('static', filename='icons/close.png') }}" alt="Close" class="btn-icon">
            </button>
        </div>
        <label class="field">Name
            <input type="text" id="edit-name" maxlength="80">
        </label>
        <label class="field">Repeat every (days)
            <input type="number" id="edit-lifespan" step="0.5" min="0.5">
        </label>
        <label class="field">Last done
            <input type="date" id="edit-date">
        </label>
        <p id="modal-error" class="error hidden"></p>
        <div class="modal-actions">
            <button type="button" id="modal-delete" class="danger">
                <img src="{{ url_for('static', filename='icons/trash.png') }}" alt="" class="btn-icon"> Delete
            </button>
            <span class="spacer"></span>
            <button type="button" id="modal-cancel">Cancel</button>
            <button type="button" id="modal-save" class="primary" disabled>Save</button>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>const ICON_BASE = "{{ url_for('static', filename='icons/') }}";</script>
<script src="{{ url_for('static', filename='edit.js') }}"></script>
{% endblock %}
