{% extends "base.html" %}
{% block title %}Potato Bakery Inc. · Edit{% endblock %}
{% block head %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
{% endblock %}
{% block content %}
        <h2 class="page-title">Edit Items</h2>
        <p id="app-version"></p>
        <div class="add-item-container">
            <input type="text" id="new-item" placeholder="New task">
            <input type="number" id="new-lifespan" placeholder="Lifespan (days)" step="0.1" min="0">
            <button id="add-button">Add</button>
        </div>
        <ul id="edit-list">
            {% for item in items %}
                <li class="edit-item-box" data-id="{{ item.id }}">
                    <div class="edit-row">
                        <input type="text" value="{{ item.string }}" class="edit-string" data-index="{{ loop.index0 }}" placeholder="Task Name" data-original="{{ item.string }}">
                        <input type="number" value="{{ item.lifespan }}" class="edit-lifespan" data-index="{{ loop.index0 }}" step="0.1" placeholder="Days" data-original="{{ item.lifespan }}">
                    </div>
                    <div class="edit-row">
                        <input type="text" value="{{ item.last_refreshed }}" class="edit-date" data-index="{{ loop.index0 }}" placeholder="Last Refreshed" data-original="{{ item.last_refreshed }}">
                        <button class="delete-button" data-index="{{ loop.index0 }}">Delete</button>
                    </div>
                </li>
            {% endfor %}
        </ul>
        <button id="save-button">Save Changes</button>
        <div id="confirmation-message" style="display: none; color: green; margin-top: 10px;">Changes saved successfully!</div>
{% endblock %}
{% block scripts %}
    <script>
        const APP_VERSION = "{{ app_version }}";
    </script>
    <script src="/static/edit.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
{% endblock %}
