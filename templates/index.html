{% extends "base.html" %}
{% block title %}Potato Bakery Inc. · Home{% endblock %}
{% block content %}
<div id="mobile-tabs" role="tablist">
    <button class="tab-button active" data-tab="tasks" role="tab">
        <img src="{{ url_for('static', filename='icons/checkbox.png') }}" alt="" class="tab-icon"> Tasks
    </button>
    <button class="tab-button" data-tab="stats" role="tab">Statistics</button>
</div>

<div id="home" data-active-tab="tasks">
    <section id="tasks-column" class="column">
        <div id="suggestions" class="panel"></div>
        <ul id="task-list"></ul>
    </section>

    <section id="stats-column" class="column">
        <!-- Interim statistics: the full set (donut, progress, histogram, 30/90/all) comes in the next block -->
        <div class="panel">
            <h2>Task Distribution</h2>
            <div id="stats-bars"></div>
        </div>
        <div class="panel">
            <h2>Oldest Tasks</h2>
            <div id="oldest-tasks-list"></div>
        </div>
    </section>
</div>
{% endblock %}
{% block scripts %}
<script>const ICON_BASE = "{{ url_for('static', filename='icons/') }}";</script>
<script src="{{ url_for('static', filename='home.js') }}"></script>
{% endblock %}
