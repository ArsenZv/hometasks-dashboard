<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeTasks-dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div id="app">
        <h1>HomeTasks-dashboard</h1>
        <div id="calendar-wrapper">
            <h2>Refresh Activity (Last 30 Days)</h2>
            <div id="refresh-calendar" class="calendar-grid"></div>
            <div id="calendar-legend">
                <span>Less</span>
                <div class="legend-levels">
                    <span class="legend-square level-0"></span>
                    <span class="legend-square level-1"></span>
                    <span class="legend-square level-2"></span>
                    <span class="legend-square level-3"></span>
                    <span class="legend-square level-4"></span>
                </div>
                <span>More</span>
            </div>
        </div>
        <p id="today-date"></p>
        <ul id="todo-list">
            {% for item in items %}
                {% set item_date = item.last_refreshed | to_datetime %}
                {% set time_difference = (current_time - item_date).total_seconds() / 86400 %}
                <li class="{% if time_difference < item.lifespan / 2 and time_difference >= 0 %}green{% elif time_difference >= item.lifespan / 2 and time_difference < item.lifespan %}yellow{% else %}red{% endif %}" title="Last refreshed: {{ item.last_refreshed }} || Lifespan: {{ item.lifespan }} days">
                    <span class="refresh-icon" data-index="{{ loop.index0 }}">↻</span>
                    <span class="item-text">{{ item.string }}</span>
                    <span class="info-icon" onclick="this.parentElement.classList.toggle('show-info')">ℹ️</span>
                    <br>
                </li>
            {% endfor %}
        </ul>
        <a href="/edit" id="edit-link" title="Edit Items">
            <span class="gear-icon">⚙️</span>
        </a>
        <input type="text" id="new-item" placeholder="Task">
        <input type="number" id="new-lifespan" placeholder="Lifespan (in days)" step="0.1">
        <button id="add-button">Add</button>
    </div>
    <script>
        const CALENDAR_DATA = {{ calendar_data | tojson }};
    </script>
    <script src="/static/app.js"></script>
</body>
</html>
