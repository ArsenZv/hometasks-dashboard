version: '3.8'

services:
  hometasks-dashboard:
    image: arsenzvdocker/hometasks-dashboard:latest
    container_name: hometasks-dashboard
    restart: always
    environment:
      TZ: Europe/Paris
    ports:
      - "5555:5555"
    volumes:
      - ./data:/app/data

  hometasks-bot:
    image: arsenzvdocker/hometasks-bot:latest
    container_name: hometasks-bot
    restart: always
    depends_on:
      - hometasks-dashboard
    env_file:
      - .env            # BOT_TOKEN and BOT_PASSWORD
    environment:
      TZ: Europe/Paris
      DASHBOARD_URL: ${DASHBOARD_URL:?set DASHBOARD_URL in .env}
      SATURDAY_TIME: "10:00"
      # DAILY_DIGEST_TIME: "09:00"   # uncomment for a daily priorities message
    volumes:
      - ./bot_data:/state
